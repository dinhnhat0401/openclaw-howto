templates:
  - name: morning-briefing
    path: "templates/morning-briefing.yaml"
    description: "Daily morning summary: calendar, GitHub, email, weather"
    trigger_type: cron
    schedule: "30 7 * * 1-5"
    model: claude-haiku-4-5
    channels: [telegram, slack, whatsapp]
    integrations: [github, gmail, calendar, weather]
    version: "1.0.0"
    status: stable

  - name: end-of-day-summary
    path: "templates/end-of-day-summary.yaml"
    description: "Daily EOD summary: commits, PRs, open tasks, tomorrow prep"
    trigger_type: cron
    schedule: "0 18 * * 1-5"
    model: claude-haiku-4-5
    channels: [telegram]
    integrations: [github, todoist, calendar]
    version: "1.0.0"
    status: stable

  - name: weekly-report
    path: "templates/weekly-report.yaml"
    description: "Friday weekly metrics: commits, PRs, meetings, task completion"
    trigger_type: cron
    schedule: "0 17 * * 5"
    model: claude-sonnet-4-6
    channels: [slack]
    integrations: [github, gmail, calendar, todoist]
    version: "1.0.0"
    status: stable

  - name: pr-pipeline
    path: "templates/pr-pipeline.yaml"
    description: "Autonomous code review on PR open/sync. Optional auto-merge."
    trigger_type: webhook
    webhook_source: github
    webhook_event: "pull_request"
    model: claude-opus-4-6
    channels: [telegram, slack]
    integrations: [github]
    version: "1.0.0"
    status: stable
    config_required: [repos, notify_channel]

  - name: meeting-autopilot
    path: "templates/meeting-autopilot.yaml"
    description: "Pre-meeting prep + post-meeting notes and action items"
    trigger_type: calendar_event
    model: claude-sonnet-4-6
    channels: [telegram]
    integrations: [calendar, github, notion]
    version: "1.0.0"
    status: stable

  - name: incident-response
    path: "templates/incident-response.yaml"
    description: "Alert triage: severity classification, runbook lookup, escalation"
    trigger_type: webhook
    webhook_source: [pagerduty, datadog, grafana]
    model: claude-opus-4-6
    channels: [slack]
    integrations: [pagerduty, datadog, github]
    version: "1.0.0"
    status: stable

  - name: control-plane-report
    path: "templates/control-plane-report.yaml"
    description: "Daily Control Plane KPI report: hands-free rate, rollback %"
    trigger_type: cron
    schedule: "0 9 * * 1-5"
    model: claude-haiku-4-5
    channels: [telegram, slack]
    integrations: [control-plane-api]
    version: "1.0.0"
    status: stable

